<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Parth Plastopack Admin Panel</title>
  <link rel="icon" type="image/webp" href="assets/images/PPPLOGO.webp">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <style>
    body.login-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--admin-bg);
      background-image: radial-gradient(circle at top right, rgba(123, 63, 163, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.05), transparent 40%);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background-color: var(--admin-surface);
      border-radius: var(--admin-radius-xl);
      box-shadow: var(--admin-shadow-lg);
      border: 1px solid var(--admin-border);
      text-align: center;
    }

    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: var(--admin-purple-light);
      border-radius: var(--admin-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(123, 63, 163, 0.15);
    }

    .login-logo img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--admin-text-main);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 0.95rem;
      color: var(--admin-text-muted);
      margin-bottom: 30px;
    }

    .login-form {
      text-align: left;
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--admin-text-main);
      margin-bottom: 8px;
    }

    .login-form .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--admin-border);
      border-radius: var(--admin-radius-md);
      font-size: 0.95rem;
      transition: all var(--transition-speed) ease;
      background-color: var(--admin-surface-subtle);
      color: var(--admin-text-main);
    }

    .login-form .form-control:focus {
      border-color: var(--admin-purple-primary);
      box-shadow: 0 0 0 4px rgba(123, 63, 163, 0.1);
      outline: none;
      background-color: var(--admin-surface);
    }

    .password-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .toggle-password {
      position: absolute;
      right: 16px;
      cursor: pointer;
      color: var(--admin-text-muted);
      transition: color var(--transition-speed) ease;
    }

    .toggle-password:hover {
      color: var(--admin-purple-primary);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(123, 63, 163, 0.35);
      margin-bottom: 16px;
    }
  </style>
</head>
<body class="admin-body login-body">

  <div class="login-container">
    <div class="login-logo">
      <img src="assets/images/PPPLOGO.webp" alt="Logo" onerror="this.src='https://placehold.co/100x100/7b3fa3/ffffff?text=PPP'">
    </div>
    
    <h1 class="login-title">Create New Password</h1>
    <p class="login-subtitle">Your new password must be different from previous used passwords.</p>

    <form class="login-form" id="resetPasswordForm">
      <div class="form-group">
        <label for="new_password" class="form-label">New Password</label>
        <div class="password-container">
          <input type="password" id="new_password" class="form-control" placeholder="••••••••" required style="padding-right: 40px;">
          <i class="fa-regular fa-eye toggle-password" onclick="toggleVis('new_password', this)"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <div class="password-container">
          <input type="password" id="confirm_password" class="form-control" placeholder="••••••••" required style="padding-right: 40px;">
          <i class="fa-regular fa-eye toggle-password" onclick="toggleVis('confirm_password', this)"></i>
        </div>
      </div>

      <button type="submit" class="btn-admin btn-purple-custom btn-login" id="saveBtn">
        Reset Password <i class="fa-solid fa-lock" style="margin-left: 8px;"></i>
      </button>
    </form>

    <script>
      function toggleVis(fieldId, icon) {
        const field = document.getElementById(fieldId);
        if (field.type === 'password') {
          field.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          field.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      }

      document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const supabaseClient = getSupabaseClient();
        if (!supabaseClient) {
          alert('Supabase client not initialized.');
          return;
        }

        const btn = document.getElementById('saveBtn');
        const p1 = document.getElementById('new_password').value;
        const p2 = document.getElementById('confirm_password').value;
        const originalText = btn.innerHTML;
        
        if (p1 !== p2) {
          btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Passwords do not match';
          btn.style.backgroundColor = 'var(--admin-red)';
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.backgroundColor = '';
          }, 2000);
          return;
        }

        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';
        btn.style.opacity = '0.8';
        btn.disabled = true;

        const { data, error } = await supabaseClient.auth.updateUser({
          password: p1
        });

        if (error) {
          btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Error updating password';
          btn.style.backgroundColor = 'var(--admin-red)';
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.backgroundColor = '';
            btn.style.opacity = '1';
            btn.disabled = false;
          }, 2000);
        } else {
          // Success! Log out user immediately to force them to sign in again
          await supabaseClient.auth.signOut();
          
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Password Updated';
          btn.style.backgroundColor = 'var(--admin-green)';
          btn.style.opacity = '1';
          
          setTimeout(() => {
            window.location.href = 'admin-login.html';
          }, 2000);
        }
      });
    </script>
    
    <div style="margin-top: 32px; font-size: 0.85rem; color: var(--admin-text-subtle);">
      &copy; 2026 Parth Plastopack Pvt. Ltd.
    </div>
  </div>

</body>
</html>
