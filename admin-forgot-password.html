<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Parth Plastopack Admin Panel</title>
  <link rel="icon" type="image/webp" href="assets/images/PPPLOGO.webp">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <style>
    body.login-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--admin-bg);
      background-image: radial-gradient(circle at top right, rgba(123, 63, 163, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.05), transparent 40%);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background-color: var(--admin-surface);
      border-radius: var(--admin-radius-xl);
      box-shadow: var(--admin-shadow-lg);
      border: 1px solid var(--admin-border);
      text-align: center;
    }

    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: var(--admin-purple-light);
      border-radius: var(--admin-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(123, 63, 163, 0.15);
    }

    .login-logo img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--admin-text-main);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 0.95rem;
      color: var(--admin-text-muted);
      margin-bottom: 30px;
    }

    .login-form {
      text-align: left;
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--admin-text-main);
      margin-bottom: 8px;
    }

    .login-form .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--admin-border);
      border-radius: var(--admin-radius-md);
      font-size: 0.95rem;
      transition: all var(--transition-speed) ease;
      background-color: var(--admin-surface-subtle);
      color: var(--admin-text-main);
    }

    .login-form .form-control:focus {
      border-color: var(--admin-purple-primary);
      box-shadow: 0 0 0 4px rgba(123, 63, 163, 0.1);
      outline: none;
      background-color: var(--admin-surface);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(123, 63, 163, 0.35);
      margin-bottom: 16px;
    }

    .back-to-login {
      display: block;
      text-align: center;
      color: var(--admin-purple-primary);
      font-weight: 600;
      font-size: 0.9rem;
      transition: color var(--transition-speed) ease;
    }

    .back-to-login:hover {
      color: var(--admin-purple-hover);
    }
  </style>
</head>
<body class="admin-body login-body">

  <div class="login-container">
    <div class="login-logo">
      <img src="assets/images/PPPLOGO.webp" alt="Logo" onerror="this.src='https://placehold.co/100x100/7b3fa3/ffffff?text=PPP'">
    </div>
    
    <h1 class="login-title">Reset Password</h1>
    <p class="login-subtitle">Enter your email and we'll send you a link to reset your password.</p>

    <form class="login-form" id="forgotPasswordForm">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="primepixeltech1@gmail.com" required>
      </div>

      <button type="submit" class="btn-admin btn-purple-custom btn-login" id="resetBtn">
        Send Reset Link <i class="fa-regular fa-paper-plane" style="margin-left: 8px;"></i>
      </button>
      
      <a href="admin-login.html" class="back-to-login"><i class="fa-solid fa-arrow-left" style="margin-right: 4px;"></i> Back to Login</a>
    </form>

    <script>
      document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const supabaseClient = getSupabaseClient();
        if (!supabaseClient) {
          alert('Supabase client not initialized.');
          return;
        }

        const btn = document.getElementById('resetBtn');
        const email = document.getElementById('email').value;
        const originalText = btn.innerHTML;
        
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
        btn.style.opacity = '0.8';
        btn.disabled = true;

        const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/admin-reset-password.html',
        });

        if (error) {
          btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Error Sending Email';
          btn.style.backgroundColor = 'var(--admin-red)';
          btn.style.opacity = '1';
          
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.backgroundColor = '';
            btn.disabled = false;
          }, 3000);
        } else {
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Reset Link Sent';
          btn.style.backgroundColor = 'var(--admin-green)';
          btn.style.opacity = '1';
          
          setTimeout(() => {
            window.location.href = 'admin-login.html';
          }, 2500);
        }
      });
    </script>
    
    <div style="margin-top: 32px; font-size: 0.85rem; color: var(--admin-text-subtle);">
      &copy; 2026 Parth Plastopack Pvt. Ltd.
    </div>
  </div>

</body>
</html>
